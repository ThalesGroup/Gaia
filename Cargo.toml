[workspace]
members = [
    "crates/gaia-core",
    "crates/gaia-cli",
    "crates/gaia-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/praedico/gaia"
authors = ["praedico"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.37"
ratatui = "0.30"
crossterm = "0.29"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
comfy-table = "7"
